function safeLiveURL(url){try{const u=new URL(url);return ['http:','https:'].includes(u.protocol)?u.href:''}catch(e){return ''}}
function liveNewsUrl(query){return 'https://news.google.com/rss/search?q='+encodeURIComponent(query)+'&hl=ko&gl=KR&ceid=KR%3Ako'}
function liveFeedFallbacks(url){return ['https://proxy.cors.dev/'+url,'https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(url)];}
function readXmlNews(xmlText,source){const doc=new DOMParser().parseFromString(xmlText,'text/xml');if(doc.querySelector('parsererror'))throw Error('RSS 응답을 읽을 수 없습니다.');const entries=Array.from(doc.querySelectorAll('item')).slice(0,16);if(!entries.length)throw Error('해당 주제에 새 기사 없음');return entries.map(n=>{let name=n.querySelector('source')?.textContent?.trim()||'Google 뉴스';let pub=n.querySelector('pubDate')?.textContent?.trim()||'';let ms=Date.parse(pub);let headline=n.querySelector('title')?.textContent?.trim()||'';let url=n.querySelector('link')?.textContent?.trim()||'';return {title:headline,url:safeLiveURL(url),source:name,date:Number.isFinite(ms)?new Date(ms).toISOString():'',cat:source.cat,why:source.why,icon:source.icon}}).filter(x=>x.title&&x.url)}
async function liveFetchOne(source){const feedUrl=liveNewsUrl(source.query);let last=null;for(const [idx,url] of liveFeedFallbacks(feedUrl).entries()){try{const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),10000);let resp;try{resp=await fetch(url,{signal:controller.signal,cache:'no-store'})}finally{clearTimeout(timer)}if(!resp.ok)throw Error('HTTP '+resp.status);if(idx===1){const val=await resp.json();if(val.status!=='ok'||!Array.isArray(val.items))throw Error('RSS JSON 응답 오류');const records=val.items.map(x=>({title:String(x.title||''),url:safeLiveURL(x.link),source:(x.author||'Google 뉴스'),date:Number.isFinite(Date.parse(x.pubDate))?new Date(x.pubDate).toISOString():'',cat:source.cat,why:source.why,icon:source.icon})).filter(x=>x.title&&x.url);if(!records.length)throw Error('새 기사 없음');return records.slice(0,12)}return readXmlNews(await resp.text(),source).slice(0,12)}catch(e){last=e}}throw last||Error('RSS 불러오기 실패')}

function searchTokens(query){const stop=new Set(['정보','검색','알려줘','알려주세요','관련','내용','대해','대한','어떻게','얼마나','있어','뭐야','확인','찾아줘','지금','오늘','우리','집','뭐','좀','좀요']);return [...new Set(String(query||'').toLowerCase().normalize('NFKC').replace(/[.,!?()[\]{}\/]/g,' ').split(/\s+/).map(x=>x.trim()).filter(x=>x.length>1&&!stop.has(x)))];}
function matchSearch(item,q,words){
 const title=item.title.toLowerCase().normalize('NFKC'),body=(item.detail+' '+item.meta+' '+item.category).toLowerCase().normalize('NFKC');
 const phrase=q.toLowerCase().normalize('NFKC').trim();
 let score=title.includes(phrase)?14:body.includes(phrase)?9:0;
 let found=0;
 for(const w of words){if(title.includes(w)){score+=6;found++}else if(body.includes(w)){score+=2;found++}}
 return found===0&&!score?0:score+(words.length&&found===words.length?4:0);
}
function searchMatches(){const q=unifiedSearch.query.trim();if(!q)return [];
 const words=searchTokens(q);
 return searchInfo().map(x=>({...x,score:matchSearch(x,q,words)})).filter(x=>x.score>0&&(unifiedSearch.category==='전체'||unifiedSearch.category===x.category)).sort((a,b)=>b.score-a.score||String(b.date).localeCompare(String(a.date))).slice(0,80);
}

<section class="card"><div class="headrow"><h3>부부 소득과 DSR 참고</h3><span class="pill warn">은행 승인 아님</span></div><div class="inputrow">${numField('finance.incomeSelf','남편 월 인정소득 (만 원)','만 원 단위로 입력')}${numField('finance.incomeSpouse','아내 월 인정소득 (만 원)','만 원 단위로 입력')}${numField('finance.existingMonthly','기존 DSR 반영 월 상환액 (만 원)','사업자대출은 일괄 반영하지 않음')}${numField('finance.dsr','DSR 기준 (%)','예시: 은행권 40')}</div><div class="spacer"></div><button class="btn primary" data-action="save-income">소득 조건 반영</button><div class="divider"></div><div class="two-compact"><div><div class="smallcap">현재 부부합산 인정소득</div><div class="big" style="font-size:22px">월 ${money(inc)}</div></div><div><div class="smallcap">심사 가정상 필요한 최소 월소득</div><div class="big" style="font-size:22px">약 ${money(need)}</div></div></div><div class="hint">DSR 참고 상환액 월 ${money(stress)} · 현재 소득 대비 추정 DSR ${fmtN(dsrUsed)}%. 참고용 계산으로, 상품별 산정만기·스트레스금리·소득평균 방식이 달라질 수 있습니다.</div></section></div>`}
function calendarHTML(){const [yy,mm]=ui.calMonth.split('-').map(Number),first=new Date(yy,mm-1,1),startDay=first.getDay(),days=new Date(yy,mm,0).getDate();const week=['일','월','화','수','목','금','토'];let cells=week.map(w=>`<div class="calweekday">${w}</div>`).join('');for(let i=0;i<42;i++){let day=i-startDay+1;let inMon=day>=1&&day<=days;let d=new Date(yy,mm-1,day),ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;let events=data.events.filter(x=>x.date===ds);let tasks=data.tasks.filter(x=>x.due===ds);let marks=[...events.map(x=>`<span class="calmark">${esc(x.title)}</span>`),...tasks.map(x=>`<span class="calmark task">${esc(x.title)}</span>`)].slice(0,2).join('');cells+=`<button class="calday ${inMon?'':'outside'} ${ds===today()?'today':''}" data-action="day" data-date="${ds}" title="${ds} · 일정 추가"><span class="calnum">${day>0?day:new Date(yy,mm-1,day).getDate()}</span><span class="calmarks">${marks}</span></button>`}return `<div class="monthnav"><button class="btn sm" data-action="cal-prev">‹ 이전달</button><h3>${yy}년 ${mm}월</h3><button class="btn sm" data-action="cal-next">다음달 ›</button></div><div class="calendar">${cells}</div><div class="hint">날짜를 누르면 해당 날짜의 일정을 새로 등록합니다. 월만 정해진 입주 일정은 목록에 표시됩니다.</div>`}
function schedulePage(){let filtered=sortedEvents().filter(x=>ui.eventFilter==='전체'||x.kind===ui.eventFilter),kinds=['전체',...new Set(data.events.map(x=>x.kind))];return `<div class="headrow"><div class="sub">기존 공고와 대화에서 정리한 일정입니다. 계약·대출 서류로 최종 확인하세요.</div><div class="actions" style="flex-direction:row"><button class="btn sm" data-action="export-ics">📆 일정 파일</button><button class="btn primary" data-action="new-event">＋ 일정 추가</button></div></div><div class="twocol"><section class="card">${calendarHTML()}</section><section class="card"><div class="headrow"><h3>확인할 일정</h3><span class="pill">${data.events.filter(x=>x.status!=='완료'&&x.status!=='납부완료').length}건 남음</span></div><div class="callout">🔔 <div><b>1차 계약금 1,000만 원은 납부 완료</b>로 기록했습니다. 전체 계약금 5%까지 남은 금액과 중도금 1회차 실제 대출 처리 여부는 각각 확인하세요.</div></div><div class="spacer"></div><div class="filterbar"><select id="eventFilter" aria-label="일정 분류">${kinds.map(x=>`<option ${ui.eventFilter===x?'selected':''}>${esc(x)}</option>`).join('')}</select><button class="btn sm" data-action="events-by-date">오늘로 이동</button></div><div style="max-height:550px;overflow:auto;padding-right:5px">${filtered.map(x=>`<div class="entry"><div style="min-width:0"><small>${esc(dateLabel(x))} · ${esc(x.kind)} · ${esc(x.owner)}</small><h4>${esc(x.title)}</h4><span class="pill ${kindPill(x.status)}">${esc(x.status)}</span>${x.note?`<p>${esc(x.note)}</p>`:''}</div><div class="right"><div class="money">${Number(x.amount)?money(x.amount):''}</div><div class="actions" style="margin-top:10px"><button class="iconbtn" data-action="edit-event" data-id="${esc(x.id)}">수정</button>${['e-contract','e-contract-first','e-ext1'].includes(x.id)?'<button class="iconbtn" data-view="payments">납부내역</button>':`<button class="iconbtn" data-action="toggle-event" data-id="${esc(x.id)}">${x.status==='완료'||x.status==='납부완료'?'되돌리기':'완료'}</button>`}</div></div></div>`).join('')||'<div class="empty">등록된 일정이 없습니다.</div>'}</div></section></div>`}
function tasksPage(){let s=summary(),list=data.tasks.filter(x=>(ui.taskFilter==='전체'||x.status===ui.taskFilter)&&(ui.ownerFilter==='전체'||x.owner===ui.ownerFilter));let active=data.tasks.filter(x=>x.status!=='완료').length;return `<div class="headrow"><div class="sub">남편·아내·함께 맡은 일을 기록하고 진행률을 관리하세요.</div><button class="btn primary" data-action="new-task">＋ 할 일 추가</button></div><div class="triple">${stat('전체 할 일',`${s.total}건`,'직접 추가·수정 가능')}${stat('완료',`${s.done}건`,`진행률 ${s.pct}%`)}${stat('남은 할 일',`${active}건`,'우선순위에 따라 진행')}</div><h2 class="sectiontitle">체크리스트</h2><section class="card"><div class="headrow"><h3>우리 가족의 할 일</h3><span class="pill teal">${s.pct}% 완료</span></div><div class="progress"><span style="width:${s.pct}%"></span></div><div class="spacer"></div><div class="filterbar"><select id="taskFilter" aria-label="진행 상태">${['전체','할 일','진행 중','보류','완료'].map(x=>`<option ${ui.taskFilter===x?'selected':''}>${x}</option>`).join('')}</select><select id="ownerFilter" aria-label="담당자">${['전체','남편','아내','함께'].map(x=>`<option ${ui.ownerFilter===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="list">${list.map(t=>`<div class="taskrow ${t.status==='완료'?'done':''}"><input type="checkbox" class="taskcheck" data-task-check="${esc(t.id)}" aria-label="${esc(t.title)} 완료 체크" ${t.status==='완료'?'checked':''}><div class="taskbody"><div class="tasktitle">${esc(t.title)}</div><div class="taskmeta">${esc(t.category)} · 담당 ${esc(t.owner)} · ${t.due?`권장/설정 마감 ${esc(t.due.replaceAll('-','.'))}`:'기한 미정'} · ${esc(t.status)} ${t.priority==='높음'?'· 🔥 우선':''}${t.memo?`<div>${esc(t.memo)}</div>`:''}</div></div><div class="actions"><button class="iconbtn" data-action="edit-task" data-id="${esc(t.id)}">수정</button><button class="iconbtn" data-action="delete-task" data-id="${esc(t.id)}">삭제</button></div></div>`).join('')||'<div class="empty">해당 조건의 할 일이 없습니다.</div>'}</div></section>`}
function docsPage(){let done=data.docs.filter(x=>x.status==='확보').length;return `<div class="headrow"><div class="sub">실제 파일은 이 앱에 업로드하지 않습니다. Google Drive 등 문서 링크와 확보 상태를 관리합니다.</div><button class="btn primary" data-action="new-doc">＋ 서류 등록</button></div><div class="triple">${stat('서류 목록',data.docs.length+'건','필요 서류 체크')}${stat('확보 완료',done+'건','링크·확인상태 기록')}${stat('아직 확인할 서류',(data.docs.length-done)+'건','계약·소득·대출 자료')}</div><h2 class="sectiontitle">중요 서류 체크</h2><section class="card"><div class="list">${data.docs.map(d=>`<div class="listrow"><div style="min-width:0"><strong>📄 ${esc(d.title)}</strong><div class="detail">${esc(d.category)} · 담당 ${esc(d.owner)} ${d.memo?'· '+esc(d.memo):''}</div>${validUrl(d.url)?`<div class="detail"><a href="${esc(d.url)}" target="_blank" rel="noopener noreferrer">서류 링크 열기 ↗</a></div>`:''}</div><div class="actions"><span class="pill ${kindPill(d.status)}">${esc(d.status)}</span><button class="iconbtn" data-action="edit-doc" data-id="${esc(d.id)}">수정</button><button class="iconbtn" data-action="delete-doc" data-id="${esc(d.id)}">삭제</button></div></div>`).join('')||'<div class="empty">등록된 서류가 없습니다.</div>'}</div></section><div class="spacer"></div><div class="callout">🔐 <div><b>개인정보 보호:</b> 주민등록번호·계좌번호·비밀번호 등 민감한 원문을 메모에 저장하지 마세요. 가족 간 공유는 클라우드 문서의 개별 접근권한을 설정해 이용하는 것이 안전합니다.</div></div>`}
function notesPage(){let notes=[...data.notes].reverse().filter(n=>[n.title,n.body,n.category].some(y=>String(y||'').toLowerCase().includes(ui.noteQuery.toLowerCase())));return `<div class="headrow"><div class="sub">가족회의 결정, 은행 상담, 분양사무소 통화 내용 등을 남겨두세요.</div><button class="btn primary" data-action="new-note">＋ 메모 추가</button></div><div class="filterbar"><input id="noteQuery" value="${esc(ui.noteQuery)}" placeholder="메모 검색" aria-label="메모 검색" /></div><div class="notesgrid">${notes.map(n=>`<section class="notecard"><div class="tags"><span class="pill teal">${esc(n.category)}</span></div><h4 style="margin-top:10px">${esc(n.title)}</h4><p>${esc(n.body)}</p><footer><small class="muted">${new Date(n.createdAt).toLocaleDateString('ko-KR')}</small><span class="actions" style="flex-direction:row"><button class="iconbtn" data-action="edit-note" data-id="${esc(n.id)}">수정</button><button class="iconbtn" data-action="delete-note" data-id="${esc(n.id)}">삭제</button></span></footer></section>`).join('')||'<div class="empty" style="grid-column:1/-1">검색 결과가 없습니다.</div>'}</div>`}
function settingsPage(){return `<section class="card" id="cloudSettings" style="margin-bottom:16px"><h3>☁️ 가족 공동 저장</h3><p class="hint">연결 상태 확인 중</p></section><div class="twocol"><section class="card"><div class="headrow"><h3>프로젝트 기본 정보</h3></div><div class="field"><label for="p-title">프로젝트 이름</label><input id="p-title" value="${esc(data.project.title)}" /></div><div class="spacer"></div><div class="field"><label for="p-address">위치</label><input id="p-address" value="${esc(data.project.address)}" /></div><div class="spacer"></div><div class="field"><label for="p-unit">평형·동호수 메모</label><input id="p-unit" value="${esc(data.project.unit)}" /></div><div class="spacer"></div><div class="field"><label for="p-move">입주 예정월</label><input id="p-move" type="month" value="${esc(data.project.moveMonth)}" /></div><div class="spacer"></div><button class="btn primary" data-action="save-project">기본 정보 저장</button></section><section class="card"><div class="headrow"><h3>저장 · 가족 공유</h3></div><div class="callout">📱 <div><b>클라우드 연결 전에는 기기에만 저장됩니다.</b> 클라우드를 연결하면 가족 구성원별 로그인으로 동일 자료를 공유합니다. 기존 납부·가계부·옵션 자료는 JSON 백업에 포함됩니다.</div></div><div class="spacer"></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-action="backup">⬇ JSON 백업 내려받기</button><button class="btn" data-action="import">⬆ 백업 가져오기</button><button class="btn" data-action="export-ics">📆 일정 .ics 내보내기</button><button class="btn" data-action="export-csv">✅ 할 일 .csv 내보내기</button></div><div class="divider"></div><p class="smallprint">이전 주소에서 데이터를 옮길 때는 기존 앱에서 가장 최근 JSON 백업을 내려받고 이 웹앱에서 '백업 가져오기'를 누르세요. 가져오기는 현재 데이터를 덮어쓰므로 기존 자료를 먼저 백업하세요.</p><p class="smallprint">최근 저장: ${new Date(data.updatedAt).toLocaleString('ko-KR')}</p></section></div><h2 class="sectiontitle">앱에 연결되는 것과 연결되지 않는 것</h2><section class="card"><div class="list"><div class="listrow"><div><strong>농협 거래내역</strong><div class="detail">NH농협 계좌·농협카드의 CSV 파일을 사용자가 직접 선택해 가져오는 기능입니다. 금융기관 로그인, 오픈뱅킹 조회, 자동 수집은 연결되어 있지 않습니다.</div></div></div><div class="listrow"><div><strong>문자 입력</strong><div class="detail">안드로이드·아이폰에서 받은 거래 문자를 복사해 붙여넣으면 금액과 날짜를 분석합니다. 문자함을 앱이 자동으로 읽거나 클라우드에서 가져오지는 않습니다.</div></div></div><div class="listrow"><div><strong>아내와 공유하기</strong><div class="detail">Firebase 클라우드를 연결하면 각자 이메일로 가입하고 동일한 가족 공간에 참여하여 공동 데이터를 실시간으로 확인합니다. 연동 전에는 백업 복원 방식으로만 사용할 수 있습니다.</div></div></div></div></section><h2 class="sectiontitle">도움말 및 주의사항</h2><section class="card"><div class="list"><div class="listrow"><div><strong>계산 기준</strong><div class="detail">구입비용 = 분양가 + 확장비 + 옵션비 + 취득세 등 + 중도금 이자 + 기타비용. 자기자금 = 구입비용 − 목표 잔금대출.</div></div></div><div class="listrow"><div><strong>일정 자료의 성격</strong><div class="detail">중도금 회차일은 기존 대화의 모집공고 일정이며, 계약금·옵션비·입주지정일 등 정확한 날짜는 서류에서 확인해야 합니다. 할 일의 기한은 개인적으로 제안된 목표일입니다.</div></div></div><div class="listrow"><div><strong>대출·세금</strong><div class="detail">생애최초 80% LTV, 40~50년 만기, DSR, 이자와 세금은 실제 승인·과세가 확정되지 않았습니다. 정확한 심사 조건은 은행·세무사·관계기관에서 확인하세요.</div></div></div><div class="listrow"><div><strong>데이터 손실 예방</strong><div class="detail">브라우저 데이터 삭제, 시크릿 모드, 다른 기기·브라우저로 이동하면 내용이 사라질 수 있습니다. 납부·문자 거래는 입력 직후에도 백업하는 것을 권장합니다.</div></div></div></div><div class="divider"></div><button class="btn danger" data-action="reset">⚠️ 이 기기 데이터 초기화</button></section>`}
function showModal(title,body,saveText,onSave,after){let m=el('modal');lastFocus=document.activeElement;m.innerHTML=`<div class="dialoghead"><h3>${esc(title)}</h3><button class="iconbtn" type="button" data-close>✕</button></div><form id="modalForm"><div class="dialogbody">${body}</div><div class="dialogfoot"><button type="button" class="btn" data-close>취소</button><button type="submit" class="btn primary">${esc(saveText||'저장')}</button></div></form>`;m.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>m.close());let form=m.querySelector('#modalForm');form.onsubmit=e=>{e.preventDefault();let values=Object.fromEntries(new FormData(form));try{onSave(values);save();m.close();render();toast('저장했습니다.')}catch(err){alert(err.message||'입력값을 확인해주세요.')}};m.onclose=()=>{if(lastFocus&&lastFocus.focus)lastFocus.focus()};m.showModal();after?.(m)}
function field(name,label,value='',type='text',extra=''){return `<div class="field"><label>${label}</label>${type==='textarea'?`<textarea name="${name}" ${extra}>${esc(value)}</textarea>`:`<input name="${name}" type="${type}" value="${esc(value)}" ${extra}>`}</div>`}
function sel(name,label,opts,selected){return `<div class="field"><label>${label}</label><select name="${name}">${opts.map(x=>`<option value="${esc(x)}" ${selected===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`}
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
function eventEditor(id='',preset=''){let x=data.events.find(v=>v.id===id)||{title:'',date:preset,month:'',kind:'생활',amount:0,status:'예정',owner:'함께',note:''};showModal(id?'일정 수정':'새 일정 추가',`${field('title','일정 이름',x.title,'text','required maxlength="110"')}<div class="spacer"></div><div class="inputrow">${field('date','정확한 날짜 (알 때만)',x.date,'date')}${field('month','예정월 (날짜 미정 시)',x.month,'month')}</div><div class="spacer"></div><div class="inputrow">${sel('kind','유형',['분양대금','중도금','확장비','옵션비','대출이자','세금','대출','생활','가족','기타'],x.kind)}${field('amount','금액 (만 원)',x.amount,'number','step="any" min="0"')}</div><div class="spacer"></div><div class="inputrow">${sel('status','상태',['예정','확인필요','진행 중','납부완료','완료'],x.status)}${sel('owner','담당',['남편','아내','함께'],x.owner)}</div><div class="spacer"></div>${field('note','확인사항 / 메모',x.note,'textarea')}`,'저장',v=>{if(!v.title.trim())throw Error('일정 이름을 입력하세요.');let obj={id:id||uid(),title:v.title.trim(),date:v.date||'',month:v.date?'':v.month||'',kind:v.kind,amount:Number(v.amount)||0,status:v.status,owner:v.owner,note:v.note||''};if(id)Object.assign(x,obj);else data.events.push(obj)})}
function taskEditor(id=''){let x=data.tasks.find(v=>v.id===id)||{title:'',category:'기타',owner:'함께',due:'',status:'할 일',priority:'보통',memo:''};showModal(id?'할 일 수정':'새 할 일 추가',`${field('title','할 일 제목',x.title,'text','required maxlength="120"')}<div class="spacer"></div><div class="inputrow">${sel('category','분류',['계약','대출','소득','옵션','세금','가족','입지','입주','기타'],x.category)}${sel('owner','담당',['남편','아내','함께'],x.owner)}${field('due','목표 날짜',x.due,'date')}${sel('priority','우선순위',['높음','보통','낮음'],x.priority)}${sel('status','진행 상태',['할 일','진행 중','보류','완료'],x.status)}</div><div class="spacer"></div>${field('memo','상세 내용',x.memo,'textarea')}`,'저장',v=>{let obj={id:id||uid(),title:v.title.trim(),category:v.category,owner:v.owner,due:v.due||'',priority:v.priority,status:v.status,memo:v.memo||''};if(!obj.title)throw Error('제목을 입력하세요.');if(id)Object.assign(x,obj);else data.tasks.push(obj)})}
function validUrl(s){try{let u=new URL(s);return u.protocol==='https:'||u.protocol==='http:'}catch(e){return false}}
function docEditor(id=''){let x=data.docs.find(v=>v.id===id)||{title:'',category:'기타',owner:'함께',status:'미확보',url:'',memo:''};showModal(id?'서류 수정':'서류 등록',`${field('title','서류 이름',x.title,'text','required maxlength="100"')}<div class="spacer"></div><div class="inputrow">${sel('category','분류',['계약','대출','소득','옵션','세금','가족','입주','기타'],x.category)}${sel('owner','담당',['남편','아내','함께'],x.owner)}${sel('status','확보 상태',['미확보','확인중','확보'],x.status)}</div><div class="spacer"></div>${field('url','클라우드 문서 링크 (선택)',x.url,'url','placeholder="https://..."')}<div class="spacer"></div>${field('memo','메모',x.memo,'textarea')}`,'저장',v=>{if(v.url&&!validUrl(v.url))throw Error('문서 링크는 http 또는 https 주소여야 합니다.');let obj={id:id||uid(),title:v.title.trim(),category:v.category,owner:v.owner,status:v.status,url:v.url||'',memo:v.memo||''};if(!obj.title)throw Error('서류 이름을 입력하세요.');if(id)Object.assign(x,obj);else data.docs.push(obj)})}
function noteEditor(id=''){let x=data.notes.find(v=>v.id===id)||{title:'',category:'가족회의',body:'',createdAt:new Date().toISOString()};showModal(id?'메모 수정':'새 메모',`${field('title','제목',x.title,'text','required maxlength="100"')}<div class="spacer"></div>${sel('category','분류',['가족회의','은행상담','분양사무소','자금','입주','기타'],x.category)}<div class="spacer"></div>${field('body','내용',x.body,'textarea','rows="7" required')}`,'저장',v=>{let obj={id:id||uid(),title:v.title.trim(),category:v.category,body:v.body.trim(),createdAt:x.createdAt};if(!obj.title||!obj.body)throw Error('제목과 내용을 입력하세요.');if(id)Object.assign(x,obj);else data.notes.push(obj)})}
function budgetEditor(){let fields=[['sale','분양가'],['extension','발코니 확장비'],['options','추가 옵션비'],['tax','취득세 등 예상'],['midInterest','중도금 이자 예상'],['other','기타 부대비용']];showModal('구입비용 수정',`<p class="smallprint" style="margin-top:0">모든 금액은 <b>만 원</b> 단위입니다. 계약서·견적서와 일치하도록 수정하세요.</p><div class="inputrow">${fields.map(([key,label])=>field(key,label+' (만 원)',data.budget[key],'number','min="0" step="any"')).join('')}</div>`,'예산 저장',v=>{for(let [key] of fields)data.budget[key]=Math.max(0,Number(v[key])||0);syncPaymentStatus();toast('기존 일정의 금액은 자동 변경되지 않습니다. 필요하면 일정에서도 수정하세요.')})}
function financeEditor(){showModal('대출 가정 변경',`<div class="inputrow">${field('loanRatio','분양가 대비 목표 대출비율 (%)',data.budget.loanRatio,'number','min="0" max="100" step="1"')}${field('years','상환기간 (년)',data.finance.years,'number','min="1" max="60" step="1"')}${field('rate','예상 실행금리 (%)',data.finance.rate,'number','min="0" max="30" step="0.1"')}${field('stressRate','심사용 참고금리 (%)',data.finance.stressRate,'number','min="0" max="30" step="0.1"')}</div>`,'반영',v=>{data.budget.loanRatio=Math.min(100,Math.max(0,Number(v.loanRatio)||0));for(let k of ['years','rate','stressRate'])data.finance[k]=Number(v[k])||0})}
function saveInputs(paths){paths.forEach(path=>{let [a,b]=path.split('.'),v=Number(document.querySelector(`[name="${path}"]`)?.value);if(!Number.isFinite(v)||v<0)throw Error('0 이상의 숫자를 입력해주세요.');data[a][b]=v});save();render();toast('계산에 반영했습니다.');}
function download(text,name,mime){const blob=new Blob([text],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function backup(){data.optSelections={...opt};save();download(JSON.stringify(data,null,2),`호반써밋_우리집_백업_${today()}.json`,'application/json;charset=utf-8');toast('납부·가계부·옵션까지 JSON 백업을 저장했습니다.')}
function icsText(v){return String(v||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;')}
function exportICS(){let events=data.events.filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x.date));let dt=new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';let lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Hoban Family Planner//KO','CALSCALE:GREGORIAN','X-WR-CALNAME:호반써밋 입주 일정'];for(let x of events){lines.push('BEGIN:VEVENT',`UID:${x.id}@hoban-family`, `DTSTAMP:${dt}`,`DTSTART;VALUE=DATE:${x.date.replaceAll('-','')}`,`SUMMARY:${icsText(x.title)}`,`DESCRIPTION:${icsText((x.note||'')+' / '+x.kind+' / 예상 금액 '+money(x.amount))}`,'END:VEVENT')}lines.push('END:VCALENDAR');download(lines.join('\r\n'),'호반써밋_정확한날짜_일정.ics','text/calendar;charset=utf-8');toast(`${events.length}개 정확한 날짜 일정을 내보냈습니다. 예정월만 있는 일정은 제외됩니다.`)}
function exportCSV(){const fields=['title','category','owner','due','status','priority','memo'];const quote=s=>'"'+String(s||'').replace(/"/g,'""')+'"';let csv='\ufeff'+[fields.join(','),...data.tasks.map(x=>fields.map(k=>quote(x[k])).join(','))].join('\r\n');download(csv,'호반써밋_할일.csv','text/csv;charset=utf-8');toast('할 일 CSV를 내보냈습니다.')}
function confirmDelete(coll,id,name){if(confirm(`${name} 항목을 삭제할까요? 이 작업은 되돌릴 수 없습니다.`)){data[coll]=data[coll].filter(x=>x.id!==id);save();render();toast('삭제했습니다.')}}

// ----------------- 계약 납부 + 가계/목장 거래 관리 (v2) -----------------
const VERIFIED_PAYMENTS=[];
function paidTotal(){return (data.payments||[]).reduce((a,x)=>a+Math.max(0,Number(x.amount)||0),0)}
function paidByKind(k){return (data.payments||[]).filter(x=>x.kind===k).reduce((a,x)=>a+Math.max(0,Number(x.amount)||0),0)}
function contractPaid(){return paidByKind('계약금')}
function syncPaymentStatus(){
 const set=(id,status,note)=>{let x=data.events.find(v=>v.id===id);if(x){x.status=status;if(note)x.note=note}};
 let sale5=Math.round(Number(data.budget.sale||0)*.05*100)/100,contract=contractPaid();
 set('e-contract',contract>=sale5?'납부완료':'진행 중',`분양가 기준 전체 계약금 5%: ${money(sale5)}. 누적 ${money(contract)} 납부, 잔여 ${money(Math.max(0,sale5-contract))}. 1차 계약금 1,000만 원은 완납. 추가 납부기한은 계약서 확인.`);
 set('e-contract-first',contract>=1000?'납부완료':'진행 중','납부내역 기준 자동 계산');
 set('e-ext1',paidByKind('발코니 확장비')>=141.5?'납부완료':'진행 중','납부내역 기준 자동 계산 · 전체 확장비 잔액은 별도');
 const t=data.tasks.find(x=>x.id==='t1');if(t){t.title='1차 계약금 1,000만 원 납부 확인';t.memo='전체 계약금 5% 잔여액은 별도';t.status=contract>=1000?'완료':'할 일'}
 const remainTask=data.tasks.find(x=>x.id==='t-contract-rem');if(remainTask){remainTask.title=`계약금 5% 잔여 ${money(Math.max(0,sale5-contract))} 납부일 확인`;remainTask.status=contract>=sale5?'완료':'할 일'}
 data.budget.alreadyPaid=paidTotal();
}
function ensureEnhanced(){
 if(!Array.isArray(data.payments))data.payments=[];
 if(!Array.isArray(data.ledger))data.ledger=[];
 if(!data.migrations||typeof data.migrations!=='object')data.migrations={};
 if(!data.migrations.paidNov26){
  const legacy=Math.max(0,Number(data.budget.alreadyPaid)||0);
  VERIFIED_PAYMENTS.forEach(p=>{if(!data.payments.some(x=>x.id===p.id))data.payments.push({...p})});
  const known=VERIFIED_PAYMENTS.reduce((a,x)=>a+x.amount,0);
  if(legacy>known+.001&&!data.payments.some(x=>x.id==='paid-legacy-difference'))data.payments.push({id:'paid-legacy-difference',date:'',kind:'기타',stage:'이전 앱 입력',amount:Math.round((legacy-known)*100)/100,memo:'이전 버전에서 이미 납부한 금액의 차액으로 입력되어 있었습니다. 실제 내역 확인 후 수정하세요.',source:'이전 버전 이관 · 확인필요'});
  data.migrations.paidNov26=true;
 }
 if(!data.tasks.some(x=>x.id==='t-contract-rem'))data.tasks.push({id:'t-contract-rem',title:'계약금 5% 중 남은 2,935만 원 납부 일정 확인',category:'계약',owner:'함께',due:'',status:'할 일',priority:'높음',memo:'계약서상 정확한 납부기한 확인'});
 if(!data.tasks.some(x=>x.id==='t-bank-split'))data.tasks.push({id:'t-bank-split',title:'가계용 계좌 분리 및 거래 구분',category:'기타',owner:'함께',due:'',status:'할 일',priority:'보통',memo:'앱에서 거래별 가계/사업 분류부터 시작'});
 if(!data.docs.some(x=>x.id==='d-payment-proof'))data.docs.push({id:'d-payment-proof',title:'1차 계약금·발코니 확장비 입금확인 자료',category:'계약',status:'미확보',owner:'함께',url:'',memo:'입금내역 또는 분양사무실 수납확인증 보관'});
 syncPaymentStatus();
 const n=data.notes.find(x=>x.id==='n1');if(n&&n.body.includes('현재 입력된 납부액'))n.body=n.body.replace('현재 입력된 납부액','납부내역');
 save();
}
function showAllMenu(){showModal('전체 메뉴',`<p class="hint">원하는 기능을 누르세요.</p><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:14px">${menu.map(([id,ic,label])=>`<button type="button" class="btn" data-view="${esc(id)}">${ic} ${esc(label)}</button>`).join('')}</div>`,'닫기',()=>{});const btn=el('modal').querySelector('button[type="submit"]');if(btn){btn.type='button';btn.onclick=()=>el('modal').close();}}
function paymentsPage(){
 const paid=paidTotal(),contract=contractPaid(),cTotal=Number(data.budget.sale||0)*.05,ext=paidByKind('발코니 확장비');
 const rows=[...data.payments].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
 return `<div class="paid-hero"><span class="pill ${contract>=1000?'good':'warn'}">${contract>=1000?'✓ 1차 계약금 납부 완료':'1차 계약금 납부 진행 중'}</span><div class="large">${money(contract)} / 1차 목표 1,000만 원</div><div class="smallprint">${contract>=1000?'1차 계약금 납부가 완료되었습니다.':'납부내역을 수정했으므로 현재 금액을 기준으로 표시합니다.'} 전체 분양계약금 5% 납부 여부와는 구분합니다.</div></div>
 <div class="triple">${stat('현재까지 총 납부액',money(paid),'계약금·확장비·추가 납부 합산')}${stat('분양계약금 5% 잔여',money(Math.max(0,cTotal-contract)),'총 계약금 '+money(cTotal)+' 기준')}${stat('발코니 확장 계약금',money(ext),'발코니 총비용 '+money(data.budget.extension)+'과 구분')}</div>
 <div class="headrow" style="margin-top:25px"><div><h3>입금 내역 · 실제 납부만 기록</h3><p class="hint">단위: 만 원. 이미 납부한 금액은 자금계획의 자기자금 부족액에서 자동 차감됩니다.</p></div><button class="btn primary" data-action="new-payment">＋ 납부 추가</button></div>
 <section class="card"><div class="tablewrap"><table><thead><tr><th>날짜</th><th>종류</th><th>회차 / 메모</th><th class="amount">납부액</th><th>관리</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x.date?esc(x.date):'날짜 미확인'}</td><td>${esc(x.kind)}</td><td><strong>${esc(x.stage||'')}</strong><div class="hint">${esc(x.memo||'')}</div></td><td class="amount"><strong>${money(x.amount)}</strong></td><td><div style="display:flex;gap:5px"><button class="iconbtn" data-action="edit-payment" data-id="${esc(x.id)}">수정</button><button class="iconbtn" data-action="delete-payment" data-id="${esc(x.id)}">삭제</button></div></td></tr>`).join('')}</tbody></table></div></section>
 <div class="spacer"></div><div class="callout">📋 <div><b>미완료 항목</b>: 전체 계약금 5% 중 남은 ${money(Math.max(0,cTotal-contract))}, 발코니 확장비 중 남은 ${money(Math.max(0,Number(data.budget.extension)-ext))}의 납부 시점은 계약서와 분양사무소 안내로 확인하세요. 입금증을 받았다면 서류함에 링크를 남길 수 있습니다.</div></div>`;
}
function paymentEditor(id=''){
 const x=data.payments.find(x=>x.id===id)||{date:today(),kind:'계약금',stage:'',amount:'',memo:'',source:'직접 입력'};
 showModal(id?'납부내역 수정':'실제 납부금 등록',`<p class="smallprint" style="margin:0 0 12px">금액은 만 원으로 입력합니다. 1,415,000원은 141.5입니다. 예정 금액이 아니라 실제 이체한 금액만 기록하세요.</p><div class="inputrow">${field('date','입금일 (모르면 비움)',x.date,'date')}${sel('kind','납부 종류',['계약금','발코니 확장비','중도금','옵션비','잔금','세금','기타'],x.kind)}${field('amount','납부액 (만 원)',x.amount,'number','min="0.01" step="0.01" required')}${field('stage','회차 또는 구분',x.stage,'text','maxlength="70"')}</div><div class="spacer"></div>${field('memo','메모 · 증빙내역',x.memo,'textarea')}`,'납부 저장',v=>{
 let amount=Number(v.amount);if(!Number.isFinite(amount)||amount<=0)throw Error('0보다 큰 실제 납부액을 입력하세요.');
 const obj={id:id||uid(),date:v.date||'',kind:v.kind,stage:v.stage.trim(),amount,memo:v.memo||'',source:x.source||'직접 입력'};
 if(id)Object.assign(x,obj);else data.payments.push(obj);syncPaymentStatus();
 });

 const rows=bankCsvParse(text);if(!confirm(`${rows.length}건의 거래를 분석했습니다. 중복 거래를 제외하고 추가할까요?\n분류가 불분명한 거래는 미분류로 저장됩니다.`))return;const r=ledgerAddRows(rows);render();toast(`${r.added}건 가져오기 완료 · 중복 ${r.dups}건 제외`)}catch(err){alert('거래내역 가져오기: '+(err.message||'읽기 실패'))}finally{e.target.value=''}})}

nfirmDelete('tasks',id,'할 일');break;case 'new-doc':docEditor();break;case 'edit-doc':docEditor(id);break;case 'delete-doc':confirmDelete('docs',id,'서류');break;case 'new-note':noteEditor();break;case 'edit-note':noteEditor(id);break;case 'delete-note':confirmDelete('notes',id,'메모');break;case 'edit-budget':budgetEditor();break;case 'edit-finance':financeEditor();break;case 'save-cash':saveInputs(['budget.cashAvailable']);break;case 'save-loan':saveInputs(['budget.loanRatio','finance.rate','finance.years','finance.stressRate']);break;case 'save-income':saveInputs(['finance.incomeSelf','finance.incomeSpouse','finance.existingMonthly','finance.dsr']);break;case 'cal-prev':case 'cal-next':{let [y,m]=ui.calMonth.split('-').map(Number),d=new Date(y,m-1+(a==='cal-prev'?-1:1),1);ui.calMonth=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;render();break}case 'events-by-date':ui.calMonth=nowMonth();render();break;case 'day':eventEditor('',act.dataset.date);break;case 'save-project':{data.project.title=el('p-title').value.trim()||'호반써밋 입주 플래너';data.project.address=el('p-address').value.trim();data.project.unit=el('p-unit').value.trim();data.project.moveMonth=el('p-move').value||'2028-10';save();render();toast('프로젝트 정보를 저장했습니다.');break}case 'backup':backup();break;case 'import':el('importInput').click();break;case 'export-ics':exportICS();break;case 'export-csv':exportCSV();break;case 'reset':{if(confirm('이 기기에 저장된 모든 진행상황이 초기화됩니다. 먼저 백업하셨나요?')&&confirm('정말 초기화하시겠습니까?')){data=seed();ensureEnhanced();opt={...OPT_DEFAULT};optStore();save();view='home';render();toast('기본 정보로 초기화했습니다.')}break}}}catch(err){alert(err.message||'작업을 처리하지 못했습니다.')}});
document.addEventListener('change',e=>{if(e.target.closest('[data-opt]')){optOnChange(e);return;}let c=e.target;if(c.dataset.taskCheck){let t=data.tasks.find(x=>x.id===c.dataset.taskCheck);if(t){t.status=c.checked?'완료':'할 일';save();render();}}if(c.id==='taskFilter'){ui.taskFilter=c.value;render()}if(c.id==='ownerFilter'){ui.ownerFilter=c.value;render()}if(c.id==='eventFilter'){ui.eventFilter=c.value;render()}if(c.id==='ledgerDomain'){ui.ledgerDomain=c.value;render()}if(c.id==='ledgerMonth'){ui.ledgerMonth=c.value;render()}});

ensureEnhanced();bindBankCsv();loadLiveCache();bind();render();setTimeout(()=>{if(view==='briefing')updateLiveNews(false)},750);setInterval(()=>{if(document.visibilityState==='visible'&&view==='briefing')updateLiveNews(false)},LIVE_INTERVAL);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&view==='briefing')updateLiveNews(false)});
window.HobanBridge={getSnapshot:()=>{data.optSelections={...opt};return clone(data)},applyRemote:(payload)=>{if(!validData(payload))throw Error('공유 데이터 형식이 올바르지 않습니다.');window.__HOBAN_REMOTE_APPLYING=true;try{data=clone(payload);opt={...OPT_DEFAULT,...(payload.optSelections||{})};ensureEnhanced();localStorage.setItem(OPT_KEY,JSON.stringify(opt));view=view||'home';render();}finally{window.__HOBAN_REMOTE_APPLYING=false}}};

<script type="text/plain" id="hoban-cloud-source">

 return ({'auth/email-already-in-use':'이미 등록된 이메일입니다. 로그인하세요.','auth/invalid-email':'이메일 주소를 확인하세요.','auth/invalid-credential':'이메일 또는 비밀번호가 맞지 않습니다.','auth/weak-password':'비밀번호를 6자 이상 입력하세요.','auth/too-many-requests':'잠시 뒤 다시 시도하세요.','permission-denied':'접근 권한이 없습니다. Firestore 규칙 및 이메일 인증을 확인하세요.','failed-precondition':'Firebase 설정 또는 Firestore 인덱스를 확인하세요.'})[code]||err?.message||'작업이 실패했습니다.';
};
function banner(text,style='') {return `<div class="cloud-banner ${style}">${text}</div>`;}
function renderPanel(){
 const target=document.getElementById('cloudSettings');
 if(!target)return;
 let html='';
 if(!configured){html=`<div class="headrow"><h3>☁️ 가족 공동 저장</h3><span class="pill warn">연결 전</span></div><p class="sub">웹 주소와 클라우드 서비스 설정 후에는 남편·아내가 각자 로그인해서 같은 데이터를 실시간으로 볼 수 있습니다.</p>${banner('아직 Firebase 설정이 입력되지 않았습니다. 이 상태에서는 기존처럼 이 기기에만 저장됩니다.','warn')}<p class="hint">배포용 ZIP의 <b>설치안내.html</b>을 열고 Firebase 연결 파일을 만들어 업로드하세요.</p>`;}
 else if(state.mode==='starting'){html='<h3>☁️ 가족 클라우드 연결</h3>'+banner('로그인 상태를 확인 중입니다.');}
 else if(!state.user){html='<h3>☁️ 가족 클라우드 로그인</h3>'+loginHTML();}
 else if(!state.user.emailVerified){html=`<div class="headrow"><h3>이메일 인증</h3><span class="pill warn">인증 대기</span></div><p class="sub">${esc(state.user.email)} 주소로 받은 Firebase 인증 메일의 링크를 먼저 누르세요.</p><div class="cloud-actions"><button class="btn primary" data-cloud="check-verify">✓ 인증 완료 확인</button><button class="btn" data-cloud="resend-verify">인증 메일 다시 보내기</button><button class="btn" data-cloud="logout">로그아웃</button></div>`;}
 else if(!state.familyId){
 const params=inviteArgs(),invite=params.get('invite'),family=params.get('family');
 html=`<h3>👨‍👩‍👧‍👦 가족 공간 연결</h3><p class="sub">${esc(state.user.email)} 로그인됨</p>`+
 (invite&&family?`<div class="cloud-banner"><b>가족 초대장이 있습니다.</b><p>초대를 보낸 가족과 납부내역·옵션·가계부를 공유합니다.</p><button class="btn primary" data-cloud="join">초대 수락하고 가족 공간 참여</button></div>`:'')+
 `<div class="cloud-banner"><b>가족 공간을 처음 만드는 분만 누르세요.</b><p>먼저 한 사람이 공간을 만들고, 다른 사람에게 초대 링크를 보내주세요. 이미 아내가 공간을 만들었다면 새로 만들지 말고 초대 링크를 사용하세요.</p><button class="btn primary" data-cloud="create-family">＋ 우리 가족 공간 만들기</button></div><div class="cloud-actions"><button class="btn" data-cloud="logout">로그아웃</button></div>`;
 }
 else {

 ${state.role==='owner'?`<div class="divider"></div><h4>아내 초대하기</h4><p class="hint">아내의 이메일을 입력하면 7일 동안 유효한 전용 초대 링크를 만들 수 있습니다. 초대받은 이메일로 가입하고 인증해야 참여할 수 있습니다.</p><form id="familyInviteForm" class="cloud-invite-form"><input aria-label="초대할 이메일" type="email" id="inviteEmail" placeholder="아내 이메일 주소" required autocomplete="off"><button class="btn primary" type="submit">초대 링크 만들기</button></form><div id="familyInviteResult"></div>`:''}
 <div class="divider"></div><h4>등록된 가족</h4><div class="cloud-members">${state.members.length?state.members.map(m=>`<div>👤 ${esc(m.email||'구성원')} <span class="pill">${m.role==='owner'?'관리자':'구성원'}</span></div>`).join(''):'구성원을 불러오고 있습니다.'}</div>
 <p class="hint" style="margin-top:13px">저장은 가족 데이터베이스와 동기화됩니다. 휴대폰·PC에서 같은 주소로 접속하면 됩니다. 이전 앱에서 옮길 때는 <b>JSON 백업 가져오기</b>를 사용하세요. 두 기기가 같은 항목을 동시에 수정하면 충돌 확인이 필요할 수 있습니다.</p>`;
 }
 if(state.error)html+=banner('⚠️ '+esc(state.error),'warn');
 target.innerHTML=html;
 }
function loginHTML(){return `<p class="hint">각자 자신의 이메일로 가입합니다. 비밀번호를 서로 공유할 필요가 없습니다.</p>
<form id="cloudAuthForm"><div class="inputrow"><div class="field"><label for="cloudEmail">이메일</label><input id="cloudEmail" type="email" required autocomplete="username" placeholder="email@example.com"></div><div class="field"><label for="cloudPassword">비밀번호</label><input id="cloudPassword" type="password" required minlength="6" autocomplete="current-password" placeholder="6자 이상"></div></div><div class="cloud-actions"><button type="submit" class="btn primary" data-auth-action="signin">로그인</button><button type="submit" class="btn" data-auth-action="signup">처음 가입</button><button type="button" class="btn sm" data-cloud="reset-pass">비밀번호 재설정</button></div></form>`;}

 (inviteArgs().get('invite')&&inviteArgs().get('family')?'<button class="btn primary" data-cloud="join">가족 초대 수락하기</button>':'')+
 '<button class="btn" data-cloud="create-family">새 가족 공간 만들기</button><button class="btn sm" data-cloud="logout">로그아웃</button>';
 else content='<h2>☁️ 가족 정보 연결 중</h2><p>공유 기록을 불러오고 있습니다.</p>';

}
function paint(){renderPanel();renderAuth();const home=document.getElementById('cloudHome');if(home){
 if(!configured)home.innerHTML='<span class="pill warn">☁️ 가족 공동저장 설정 전</span> <button class="btn sm" data-view="settings">설정하기</button>';
 else home.innerHTML=`<span class="pill ${state.ready&&!state.pending?'good':'warn'}">☁️ ${state.ready?(state.pending?'동기화 대기':'부부 공동저장 연결'):'로그인/연결 필요'}</span> <button class="btn sm" data-view="settings">가족 관리</button>`;
 }}
window.HobanCloud={refreshUI:paint,queueSave:()=>queueSave(),isEnabled:()=>configured,isReady:()=>state.ready};
if(!configured){setTimeout(paint,0);return;}
if(!c()?.initializeApp){state.mode='error';state.error='Firebase 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하세요.';paint();return;}
let auth,db,mainRef,timer=null,lastAppliedRevision=-1;
try{const app=c().initializeApp(config);auth=app.auth();db=app.firestore();}catch(e){state.error=firebaseError(e);state.mode='error';paint();return;}
function signedVerified(){return !!(state.user&&state.user.emailVerified);}
function uid(){return state.user?.uid||'';}
async function authSubmit(e){const btn=e.submitter;const action=btn?.dataset.authAction||'signin';const form=e.currentTarget;const email=form.querySelector('#cloudEmail')?.value?.trim()||'';const password=form.querySelector('#cloudPassword')?.value||'';
 if(!email||password.length<6){state.error='이메일과 6자 이상 비밀번호를 입력하세요.';paint();return;}
 state.error='';try{
  if(action==='signup'){let credential=await auth.createUserWithEmailAndPassword(email,password);await credential.user.sendEmailVerification();state.user=credential.user;state.mode='verify';state.error='인증 메일을 보냈습니다. 이메일의 링크를 클릭하세요.';}
  else await auth.signInWithEmailAndPassword(email,password);
 }catch(err){state.error=firebaseError(err);}paint();}
async function verify(){try{await auth.currentUser?.reload();state.user=auth.currentUser;if(state.user?.emailVerified){await auth.currentUser.getIdToken(true);await openFamily();}else state.error='아직 인증되지 않았습니다. 받은 편지함과 스팸함을 확인하세요.';}catch(e){state.error=firebaseError(e)}paint()}
async function resend(){try{await state.user?.sendEmailVerification();state.error='인증 메일을 다시 발송했습니다.';}catch(e){state.error=firebaseError(e)}paint()}
async function resetPass(){const email=prompt('비밀번호를 재설정할 이메일 주소를 입력하세요.');if(!email)return;try{await auth.sendPasswordResetEmail(email.trim());alert('해당 주소로 재설정 안내 메일을 요청했습니다.');}catch(err){alert(firebaseError(err))}}
async function logout(){if(!confirm('로그아웃할까요? 로그인 없이 가족 자료를 볼 수 없게 됩니다.'))return;
 try{if(state.pending){alert('저장 대기 중인 변경사항이 있습니다. 인터넷 연결을 확인하고 동기화한 다음 로그아웃하세요.');return}await auth.signOut()}catch(e){state.error=firebaseError(e);paint()}}
function docPath(f){return db.collection('households').doc(f)}
async function createFamily(){if(!signedVerified())return; if(!confirm('새 가족 공간을 만들까요? 이미 초대받았다면 취소하고 초대 링크로 참여하세요.'))return;
 state.error='';const fam= db.collection('households').doc();try{
 await fam.set({ownerUid:uid(),title:'광주호반써밋 우리 가족',createdAt:c().firestore.FieldValue.serverTimestamp()});
 await fam.collection('members').doc(uid()).set({uid:uid(),email:emailOf(state.user),role:'owner'});
 const initial=getApp()?.getSnapshot?.();if(!initial||initial.appId!==APP)throw Error('앱 데이터를 읽을 수 없습니다.');
 await fam.collection('shared').doc('main').set({payload:initial,revision:1,updatedAt:c().firestore.FieldValue.serverTimestamp()});
 await db.collection('users').doc(uid()).set({email:emailOf(state.user),householdId:fam.id,updatedAt:c().firestore.FieldValue.serverTimestamp()});
 state.familyId=fam.id;state.role='owner';await activateFamily();
 }catch(e){state.error='가족 공간 생성 실패: '+firebaseError(e);paint();}}
async function joinFamily(){const args=inviteArgs(),f=args.get('family'),invite=args.get('invite');if(!f||!invite){state.error='초대 링크가 올바르지 않습니다.';paint();return}
 if(!signedVerified())return;state.error='';try{
 const fam=docPath(f);const inv=await fam.collection('invites').doc(invite).get();
 if(!inv.exists||inv.data().email!==emailOf(state.user)||inv.data().active!==true||inv.data().expiresAt.toMillis()<Date.now())throw Error('초대가 만료되었거나 로그인 이메일과 일치하지 않습니다.');
 await fam.collection('members').doc(uid()).set({uid:uid(),email:emailOf(state.user),role:'member',invite:invite});
 await db.collection('users').doc(uid()).set({email:emailOf(state.user),householdId:f,updatedAt:c().firestore.FieldValue.serverTimestamp()});
 state.familyId=f;state.role='member';history.replaceState({},'',location.pathname);await activateFamily();
 }catch(e){state.error='초대 수락 실패: '+firebaseError(e);paint()}}
async function invite(e){e.preventDefault();if(state.role!=='owner')return;const email=e.target.querySelector('input[type="email"]')?.value?.trim().toLowerCase();if(!email)return;
 const token=Array.from(crypto.getRandomValues(new Uint8Array(24))).map(x=>x.toString(16).padStart(2,'0')).join('');
 const expiry=new Date(Date.now()+7*24*60*60*1000);try{
 await docPath(state.familyId).collection('invites').doc(token).set({email,active:true,createdAt:c().firestore.FieldValue.serverTimestamp(),expiresAt:c().firestore.Timestamp.fromDate(expiry)});
 const url=familyLink()+'&invite='+encodeURIComponent(token);
 const dest=document.getElementById('familyInviteResult');if(dest){dest.innerHTML=`<div class="cloud-banner"><b>${esc(email)} 전용 초대 주소</b><p>아내에게 아래 주소를 전달하세요. 메일 인증을 마친 동일한 이메일로만 참여할 수 있습니다.</p><textarea readonly rows="4" class="cloud-link-copy">${esc(url)}</textarea><button class="btn primary" data-cloud="copy-invite">링크 복사</button></div>`;dest.dataset.invite=url;}
 }catch(err){state.error='초대 링크 생성 실패: '+firebaseError(err);paint()}}
async function openFamily(){state.mode='loading';state.ready=false;paint();try{
 const profile=await db.collection('users').doc(uid()).get();
 if(!profile.exists||!profile.data().householdId){state.familyId='';state.role='';state.mode='choose';paint();return}
 state.familyId=profile.data().householdId;
 const member=await docPath(state.familyId).collection('members').doc(uid()).get();
 if(!member.exists){throw Error('가족 공간의 접근 권한이 없습니다. 관리자에게 다시 초대받으세요.');}
 state.role=member.data().role;await activateFamily();
 }catch(e){state.error=firebaseError(e);state.familyId='';state.role='';state.mode='choose';paint()}}
async function activateFamily(){state.mode='loading';state.ready=false;paint();try{
 const r=docPath(state.familyId).collection('shared').doc('main');const first=await r.get();if(!first.exists)throw Error('공동 데이터가 없습니다.');
 mainRef=r;lastAppliedRevision=first.data().revision||0;state.base=deepClone(first.data().payload);
 getApp()?.applyRemote?.(first.data().payload);state.ready=true;state.mode='ready';state.status='모든 기록 불러옴';paint();
 state.unsub?.();state.unsub=r.onSnapshot(snapshot=>{
  if(!snapshot.exists||!snapshot.data()?.payload)return;
  const rev=snapshot.data().revision||0;
  if(rev<=lastAppliedRevision)return;
  if(state.pending||state.processing)return;
  lastAppliedRevision=rev;state.base=deepClone(snapshot.data().payload);
  getApp()?.applyRemote?.(snapshot.data().payload);state.status='다른 기기 변경사항 반영됨';paint();
 },err=>{state.error='동기화 수신 오류: '+firebaseError(err);paint();});
 await fetchMembers();
 }catch(e){state.error='가족 데이터 불러오기 실패: '+firebaseError(e);state.ready=false;paint()}}
async function fetchMembers(){try{const snap=await docPath(state.familyId).collection('members').get();state.members=snap.docs.map(x=>x.data());paint()}catch(e){state.error=firebaseError(e);paint()}}
function eq(a,b){return JSON.stringify(a)===JSON.stringify(b)}
const MISSING=Symbol('missing');
function same(a,b){return a===MISSING&&b===MISSING||a!==MISSING&&b!==MISSING&&eq(a,b)}
function isRecord(x){return x&&typeof x==='object'&&!Array.isArray(x)}
function byId(arr){return new Map(arr.map(x=>[String(x.id),x]));}
function mergeThree(base,local,remote,path='root'){
 if(same(base,local))return remote;
 if(same(base,remote))return local;
 if(same(local,remote))return local;
 if(base!==MISSING&&local!==MISSING&&remote!==MISSING&&Array.isArray(base)&&Array.isArray(local)&&Array.isArray(remote)&&[base,local,remote].every(a=>a.every(x=>x&&typeof x==='object'&&x.id))){
  const bm=byId(base),lm=byId(local),rm=byId(remote);
  const ids=[...new Set([...rm.keys(),...lm.keys(),...bm.keys()])];const out=[];
  for(const id of ids){const val=mergeThree(bm.has(id)?bm.get(id):MISSING,lm.has(id)?lm.get(id):MISSING,rm.has(id)?rm.get(id):MISSING,path+'/'+id);if(val!==MISSING)out.push(val)}
  return out;
 }
 if(isRecord(base)&&isRecord(local)&&isRecord(remote)){
  const out={};for(const key of new Set([...Object.keys(base),...Object.keys(local),...Object.keys(remote)])){
   if(key==='updatedAt'&&path==='root')continue;
   const v=mergeThree(Object.prototype.hasOwnProperty.call(base,key)?base[key]:MISSING,Object.prototype.hasOwnProperty.call(local,key)?local[key]:MISSING,Object.prototype.hasOwnProperty.call(remote,key)?remote[key]:MISSING,path+'/'+key);
   if(v!==MISSING)out[key]=v;
  }
  if(path==='root')out.updatedAt=new Date().toISOString();
  return out;
 }
 throw new Error('동시에 변경된 항목: '+path);
}
function queueSave(){if(!configured||!state.ready||!mainRef)return;
 state.pending=true;state.saveSeq+=1;state.status='저장 대기';paint();clearTimeout(timer);timer=setTimeout(flush,700);}
async function flush(){if(!state.ready||!state.pending||state.processing)return;if(!navigator.onLine){state.status='오프라인 · 연결 시 다시 저장';paint();return;}
 state.processing=true;const seq=state.saveSeq;const local=deepClone(getApp().getSnapshot());const base=state.base?deepClone(state.base):deepClone(local);state.error='';state.status='클라우드에 저장 중';paint();
 try{
  let merged,rev;
  await db.runTransaction(async tx=>{
   const current=await tx.get(mainRef);if(!current.exists)throw Error('공유 데이터가 없습니다.');
   const v=current.data();if(v.payload.appId!==APP)throw Error('예상한 가족 데이터가 아닙니다.');
   merged=mergeThree(base,local,v.payload);rev=(Number(v.revision)||0)+1;
   tx.set(mainRef,{payload:merged,revision:rev,updatedAt:c().firestore.FieldValue.serverTimestamp()});
  });
  state.base=deepClone(merged);lastAppliedRevision=rev;state.pending=state.saveSeq!==seq;state.status=state.pending?'새 변경사항 저장 대기':'저장 완료';
  if(!state.pending)getApp()?.applyRemote?.(merged);
 }catch(e){state.status='저장 실패 · 이 기기 기록 보존';state.error=firebaseError(e)+' / 기존 기록은 현재 기기에 남아 있습니다. 설정에서 JSON 백업을 먼저 받아두세요.';
  if(/동시에 변경된 항목/.test(e.message||''))state.error+=' 동시 편집 충돌이므로 자동으로 덮어쓰지 않았습니다.';
 }finally{state.processing=false;paint();if(state.pending&&state.saveSeq!==seq){clearTimeout(timer);timer=setTimeout(flush,700)}}}
async function syncNow(){if(state.pending)await flush();else {try{const doc=await mainRef.get({source:'server'});if(doc.exists){state.base=deepClone(doc.data().payload);lastAppliedRevision=doc.data().revision||0;getApp()?.applyRemote?.(doc.data().payload);state.status='최신 정보 수신 완료'}}catch(e){state.error=firebaseError(e)}}paint()}
document.addEventListener('submit',e=>{if(e.target.id==='cloudAuthForm'){e.preventDefault();authSubmit(e)}if(e.target.id==='familyInviteForm'){e.preventDefault();invite(e)} });
document.addEventListener('click',e=>{const b=e.target.closest('[data-cloud]');if(!b)return;const action=b.dataset.cloud;state.error='';switch(action){
 case 'check-verify':verify();break;case 'resend-verify':resend();break;case 'reset-pass':resetPass();break;case 'logout':logout();break;case 'create-family':createFamily();break;case 'join':joinFamily();break;
 case 'sync':syncNow();break;
 case 'copy-invite':{const url=document.getElementById('familyInviteResult')?.dataset.invite;if(url){if(navigator.clipboard?.writeText)navigator.clipboard.writeText(url).then(()=>alert('아내에게 보낼 초대 주소를 복사했습니다.')).catch(()=>prompt('초대 주소 복사',url));else prompt('초대 주소 복사',url)}break;}
 }});
window.addEventListener('online',()=>{if(state.pending)flush()});
auth.onAuthStateChanged(async user=>{
 state.unsub?.();state.unsub=null;state.user=user;state.ready=false;state.pending=false;state.base=null;state.familyId='';state.role='';state.members=[];state.mode='starting';state.error='';
 if(!user){state.mode='signedout';paint();return}
 if(!user.emailVerified){state.mode='verify';paint();return}
 await openFamily();
},err=>{state.error=firebaseError(err);state.mode='error';paint()});
paint();
})();

</script>
<script>
(()=>{'use strict';
 const cfg=window.HOBAN_FIREBASE_CONFIG;
 const configured=!!(cfg&&cfg.apiKey&&cfg.projectId&&cfg.appId&&cfg.authDomain);
 const source=document.getElementById('hoban-cloud-source').textContent;
 const load=(url)=>new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=url;s.onload=resolve;s.onerror=()=>reject(Error('클라우드 구성요소 연결 실패'));document.head.appendChild(s)});
 async function init(){
  if(configured){
   document.body.classList.add('cloud-locked');
   const o=document.createElement('div');o.id='cloudAuthOverlay';o.className='cloud-auth-overlay';o.innerHTML='<div class="cloud-auth-card"><h2>광주호반써밋</h2><p>가족 클라우드에 연결하고 있습니다.</p></div>';document.body.appendChild(o);
   for(const name of ['app','auth','firestore'])await load('https://www.gstatic.com/firebasejs/13.4.0/firebase-'+name+'-compat.js');
  }
  const s=document.createElement('script');s.textContent=source;document.body.appendChild(s);
 }
 init().catch(err=>{const o=document.getElementById('cloudAuthOverlay');if(o)o.textContent='연결 실패: '+String(err.message||err);});
})();
</script>
